<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5a3"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <polygon points="50,5 90,20 80,75 50,95 20,75 10,20" fill="#121824" stroke="url(#logoGlow)" stroke-width="3" filter="url(#neon)"/>
  <!-- Inner Detail -->
  <polygon points="50,14 80,26 72,70 50,85 28,70 20,26" fill="#182030" stroke="#26334d" stroke-width="1.5"/>
  <!-- Crossed Swords -->
  <path d="M30,30 L70,70 M25,35 L35,25 M65,65 L75,75 M32,38 L22,48" stroke="#00e5a3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M70,30 L30,70 M75,35 L65,25 M35,65 L25,75 M68,38 L78,48" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Central Prismatic Jewel -->
  <polygon points="50,38 60,50 50,62 40,50" fill="#fbbf24" stroke="#fff" stroke-width="1.5" filter="url(#neon)"/>
  <polygon points="50,42 56,50 50,58 44,50" fill="#fff" opacity="0.6"/>
</svg>
